<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex justify-center items-center min-h-screen">
    <div class="bg-black p-6 rounded-[35px] shadow-2xl border-gray-700 w-[340px]">
        <input type="text" id="display" class="w-full bg-black text-right text-white text-6xl font-light p-5 mb-6 outline-none" readonly>
        
        <div class="grid grid-cols-4 gap-3">
            <button class="bg-gray-400 text-black w-16 h-16 rounded-full text-xl font-semibold hover:bg-gray-300 active:scale-95 transition duration-150" data-value="DEL">DEL</button>
            <button class="bg-gray-400 text-black w-16 h-16 rounded-full text-xl font-semibold hover:bg-gray-300 active:scale-95 transition duration-150" data-value="AC">AC</button>
            <button class="bg-gray-400 text-black w-16 h-16 rounded-full text-xl font-semibold hover:bg-gray-300 active:scale-95 transition duration-150" data-value="%">%</button>

            <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150" data-value="/">/</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="7">7</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="8">8</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="9">9</button>
            <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150" data-value="*">*</button>

            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="4">4</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="5">5</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="6">6</button>
            <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150" data-value="-">-</button>

            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="1">1</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="2">2</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value="3">3</button>
            <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150" data-value="+">+</button>

            <button class="bg-gray-700 text-white h-16 col-span-2 rounded-full text-2xl text-left pl-6 hover:bg-gray-600 active:scale-95 transition duration-150" data-value="0">0</button>
            <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-95 transition duration-150" data-value=".">.</button>
            <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150" data-value="=">=</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
