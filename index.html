<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex justify-center items-center min-h-screen">
    <div class="bg-black p-6 rounded-[35px] shadow-2xl border-gray-700 w-[340px]">
        <input type="text" id="display" class="w-full bg-black text-white text-white text-5xl p-5 mb-6 outline-none" readonly>
    </div>

    <div class="grid grid-cols-4 gap-3">
        <button class="bg-gray-400 text-black w-16 h-16 rounded-full text-xl font-semibold hover:bg-gray-300 active:scale-95 transition duration-150">DEL</button>
        <button class="bg-gray-400 text-black w-16 h-16 rounded-full text-xl font-semibold hover:bg-gray-300 active:scale-95 transition duration-150">AC</button>
        <button class="bg-gray-400 text-black w-16 h-16 rounded-full text-xl font-semibold hover:bg-gray-300 active:scale-95 transition duration-150">%</button>

        <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150">/</button>
        <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150">*</button>
        <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150">-</button>
        <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150">+</button>
        <button class="bg-orange-500 text-white w-16 h-16 rounded-full text-2xl hover:bg-orange-400 active:scale-95 transition duration-150">=</button>

        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">7</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">8</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">9</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">4</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">5</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">6</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">1</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">2</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">3</button>
        <button class="bg-gray-700 text-white w-16 h-16 col-span-2 rounded-full text-2xl text-left pl-6 hover:bg-gray-600 active:scale-85 transition duration-150">0</button>
        <button class="bg-gray-700 text-white w-16 h-16 rounded-full text-2xl hover:bg-gray-600 active:scale-85 transition duration-150">.</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
