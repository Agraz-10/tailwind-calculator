<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex justify-center items-center h-screen">
    <div class="bg-gray-800 p-6 rounded-lg shadow-xl">
        <input type="text" id="display" class="w-full bg-white text-right text-3xl p-4 rounded mb-5" readonly>
    </div>

    <div class="grid grid-cols-4 gap-3">
        <button class="bg-red-500 text-white p-4 rounded">AC</button>
        <button class="bg-yellow-500 text-white p-4 rounded">DEL</button>
        <button class="bg-blue-500 text-white p-4 rounded">%</button>
        <button class="bg-blue-500 text-white p-4 rounded">/</button>

        <button class="bg-gray-700 text-white p-4 rounded">7</button>
        <button class="bg-gray-700 text-white p-4 rounded">8</button>
        <button class="bg-gray-700 text-white p-4 rounded">9</button>
        <button class="bg-blue-700 text-white p-4 rounded">*</button>

        <button class="bg-gray-700 text-white p-4 rounded">4</button>
        <button class="bg-gray-700 text-white p-4 rounded">5</button>
        <button class="bg-gray-700 text-white p-4 rounded">6</button>
        <button class="bg-blue-700 text-white p-4 rounded">-</button>

        <button class="bg-gray-700 text-white p-4 rounded">1</button>
        <button class="bg-gray-700 text-white p-4 rounded">2</button>
        <button class="bg-gray-700 text-white p-4 rounded">3</button>
        <button class="bg-blue-700 text-white p-4 rounded">+</button>

        <button class="bg-green-700 text-white p-4 rounded" col-span-2>0</button>
        <button class="bg-gray-700 text-white p-4 rounded">.</button>
        <button class="bg-green-500 text-white p-4 rounded">=</button>
    </div>
    
</body>
</html>
