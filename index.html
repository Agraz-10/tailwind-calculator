<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex justify-center items-center min-h-screen">
    <div class="bg-black p-6 rounded-[35px] shadow-2xl border-gray-700">
        <input type="text" id="display" class="w-full bg-black text-white text-white text-5xl p-5 mb-6 outline-none" readonly>
    </div>

    <div class="grid grid-cols-4 gap-3">
        <button class="bg-red-500 text-white p-4 rounded" data-value="AC">AC</button>
        <button class="bg-yellow-500 text-white p-4 rounded" data-value="DEL">DEL</button>
        <button class="bg-blue-500 text-white p-4 rounded" data-value="%">%</button>
        <button class="bg-blue-500 text-white p-4 rounded" data-value="/">/</button>

        <button class="bg-gray-700 text-white p-4 rounded" data-value="7">7</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value="8">8</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value="9">9</button>
        <button class="bg-blue-700 text-white p-4 rounded" data-value="*">*</button>

        <button class="bg-gray-700 text-white p-4 rounded" data-value="4">4</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value="5">5</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value="6">6</button>
        <button class="bg-blue-700 text-white p-4 rounded" data-value="-">-</button>

        <button class="bg-gray-700 text-white p-4 rounded" data-value="1">1</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value="2">2</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value="3">3</button>
        <button class="bg-blue-700 text-white p-4 rounded" data-value="+">+</button>

        <button class="bg-green-700 text-white p-4 rounded" data-value="0" col-span-2>0</button>
        <button class="bg-gray-700 text-white p-4 rounded" data-value=".">.</button>
        <button class="bg-green-500 text-white p-4 rounded" data-value="=">=</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
